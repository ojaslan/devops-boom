#NAME OF THE WORKFLOW
name: CICD

on:
  push:

jobs:

  code:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        run: echo "Code checkout"

  build:
    runs-on: ubuntu-latest
    needs: code
    steps:
      - name: Build
        run: echo "Building application"

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Test
        run: echo "Testing application"

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy
        run: echo "Deploying application"
